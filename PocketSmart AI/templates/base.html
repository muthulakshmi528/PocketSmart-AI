<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<header class="nav">

    <a
        class="brand"
        href="/"
    >
        PocketSmart AI
    </a>

    <nav>

        <a href="/planner/home">
            Home
        </a>

        <a href="/planner/party">
            Party
        </a>

        <a href="/planner/jewelry">
            Jewelry
        </a>

        <a href="/dashboard">
            Dashboard
        </a>

        <a
            href="/login"
            id="authLink"
        >
            Login
        </a>

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer class="footer">

    PocketSmart AI ·
    Budget-aware recommendations ·
    Verify live prices before purchase.

</footer>


<script src="/static/js/app.js"></script>


{% block scripts %}
{% endblock %}

</body>

</html>
